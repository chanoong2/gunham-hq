<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13285E">
<meta name="robots" content="noindex,nofollow">
<title>군함맥주 본사</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#13285E;--navy2:#0B1C47;--sky:#2FA6EE;--sky2:#1E8FD8;--skyl:#E6F4FD;--ice:#F4F8FC;--ink:#0F1F3D;--sub:#5C6F8C;--line:#DCE6F0;--gold:#E7A321;--goldl:#FFF5DF;--red:#E5484D;--redl:#FDECEC;--green:#16A36D;--greenl:#E3F6EE;--orange:#F08C00;--purple:#7B5BD6;--r:14px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--ice);color:var(--ink);font-family:Pretendard,'Malgun Gothic',system-ui,sans-serif;font-size:15px;line-height:1.5;word-break:keep-all}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
a{color:inherit;text-decoration:none}
.hide{display:none!important}
/* layout */
#app{min-height:100vh}
.side{display:none}
.top{position:sticky;top:0;z-index:20;background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;align-items:center;gap:10px}
.top img{height:26px}.top .tt{font-weight:800;font-size:16px;flex:1;letter-spacing:-.2px}.top .tt small{display:block;font-size:11px;font-weight:500;opacity:.7;letter-spacing:0}
.av{width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:13px;flex:0 0 auto}
.av.sm{width:26px;height:26px;font-size:11px}.av.lg{width:44px;height:44px;font-size:16px}
main{padding:14px 14px calc(90px + env(safe-area-inset-bottom));max-width:620px;margin:0 auto}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{flex:1;padding:8px 0 7px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;font-weight:600;color:#8A9AB2}
.tabs button svg{width:23px;height:23px}
.tabs button.on{color:var(--navy)}
.tabs button.on svg{color:var(--sky2)}
/* cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px}
.ch{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:8px}
.ch h3{font-size:16px;font-weight:800;letter-spacing:-.3px}.ch .more{font-size:13px;color:var(--sky2);font-weight:700}
.sec-t{font-size:13px;font-weight:800;color:var(--sub);margin:18px 2px 8px;letter-spacing:.2px}
.hero{background:linear-gradient(135deg,var(--navy) 0%,#1B4A9A 100%);color:#fff;border-radius:18px;padding:18px;margin-bottom:12px;display:flex;gap:14px;align-items:center}
.hero .d{font-size:13px;opacity:.8}.hero h2{font-size:20px;font-weight:800;margin:2px 0 4px;letter-spacing:-.4px}.hero p{font-size:13.5px;opacity:.9}
.ring{--p:0;width:74px;height:74px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.18) 0);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
.ring b{width:58px;height:58px;border-radius:50%;background:var(--navy);display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:800}
.ring.light{background:conic-gradient(var(--sky2) calc(var(--p)*1%),#E7EEF6 0)}.ring.light b{background:#fff;color:var(--navy)}
.ring.s{width:46px;height:46px}.ring.s b{width:36px;height:36px;font-size:12px}
/* todo rows */
.todo{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid #EEF2F7}
.todo:last-child{border-bottom:0}
.chk{width:28px;height:28px;border-radius:50%;border:2px solid #C5D3E3;flex:0 0 auto;display:flex;align-items:center;justify-content:center;color:#fff;transition:.15s}
.chk.on{background:var(--green);border-color:var(--green)}
.chk svg{width:16px;height:16px}
.todo .tx{flex:1;min-width:0}.todo .tx b{display:block;font-weight:700;font-size:15px}.todo.done .tx b{color:#9AA8BC;text-decoration:line-through}
.todo .tx span{font-size:12.5px;color:var(--sub)}
.tm{font-size:12.5px;font-weight:700;color:var(--sky2);background:var(--skyl);border-radius:8px;padding:3px 8px;flex:0 0 auto}
.cat{display:inline-block;font-size:11.5px;font-weight:700;border-radius:6px;padding:1px 7px;background:#EEF2F7;color:#4A5D7A;margin-right:4px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:20px;padding:3px 10px;background:#EEF2F7;color:#4A5D7A;white-space:nowrap}
.chip.blue{background:var(--skyl);color:var(--sky2)}.chip.red{background:var(--redl);color:var(--red)}.chip.green{background:var(--greenl);color:var(--green)}.chip.gold{background:var(--goldl);color:#B57A00}.chip.navy{background:var(--navy);color:#fff}.chip.purple{background:#EFEAFB;color:var(--purple)}
.seg{display:flex;background:#E8EEF5;border-radius:12px;padding:3px;gap:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 6px;border-radius:9px;font-weight:700;font-size:13.5px;color:var(--sub)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 1px 3px rgba(15,31,61,.12)}
/* task cards */
.task{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px;display:block;width:100%;text-align:left}
.task .r1{display:flex;align-items:flex-start;gap:8px}.task .r1 b{flex:1;font-size:15.5px;font-weight:800;letter-spacing:-.2px}
.task .r2{display:flex;align-items:center;gap:6px;margin-top:8px;flex-wrap:wrap;font-size:12.5px;color:var(--sub)}
.bar{height:6px;background:#E8EEF5;border-radius:4px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--sky2);border-radius:4px}
.bar.g i{background:var(--green)}
/* calendar */
.cal-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cal-h b{font-size:18px;font-weight:800}
.cal-h button{width:36px;height:36px;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:18px;font-weight:700;color:var(--navy)}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.grid .wd{text-align:center;font-size:12px;font-weight:700;color:var(--sub);padding:4px 0}
.grid .wd:first-child,.grid .day.sun .n{color:var(--red)}.grid .wd:last-child,.grid .day.sat .n{color:var(--sky2)}
.day{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:58px;padding:4px 3px;text-align:left;display:flex;flex-direction:column;gap:2px;overflow:hidden}
.day .n{font-size:12.5px;font-weight:700;padding-left:3px}.day.out{opacity:.35}.day.hol .n{color:var(--red)}
.day.today{border:2px solid var(--sky2)}.day.sel{background:var(--navy);border-color:var(--navy)}.day.sel .n{color:#fff!important}
.dots{display:flex;flex-wrap:wrap;gap:2px;padding-left:3px}.dots i{width:6px;height:6px;border-radius:50%}
.day .lbl{font-size:10px;line-height:1.25;padding:1px 3px;border-radius:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:none}
.ev{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid #EEF2F7;align-items:flex-start}
.ev:last-child{border-bottom:0}.ev .bd{width:4px;align-self:stretch;border-radius:3px;flex:0 0 auto}
.ev .tx{flex:1}.ev .tx b{display:block;font-weight:700}.ev .tx span{font-size:12.5px;color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12px;color:var(--sub);margin:8px 2px 0}.legend i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}.kpi span{font-size:12.5px;color:var(--sub);font-weight:600}.kpi b{display:block;font-size:24px;font-weight:800;letter-spacing:-.5px;margin-top:2px}.kpi b small{font-size:13px;color:var(--sub);font-weight:600;margin-left:3px}
.kpi.warn b{color:var(--red)}
.mem{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;margin-bottom:10px}
.mem .mh{display:flex;align-items:center;gap:10px}.mem .mh .nm{flex:1}.mem .mh .nm b{font-size:16px;font-weight:800}.mem .mh .nm span{display:block;font-size:12.5px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px}
.stats div{background:var(--ice);border-radius:10px;padding:7px 4px;text-align:center}.stats b{display:block;font-size:16px;font-weight:800}.stats span{font-size:11px;color:var(--sub);font-weight:600}
.stats .bad b{color:var(--red)}
.wkgrid{width:100%;border-collapse:separate;border-spacing:4px}.wkgrid th{font-size:12px;color:var(--sub);font-weight:700}.wkgrid td{text-align:center;border-radius:8px;font-size:12px;font-weight:800;height:34px}
.wkgrid td.nm{text-align:left;font-weight:700;font-size:13px;padding-left:2px;white-space:nowrap}
.pipe{display:flex;flex-direction:column;gap:6px}.pipe div{display:flex;align-items:center;gap:8px;font-size:13px}.pipe span{width:64px;color:var(--sub);font-weight:600}.pipe i{height:18px;border-radius:5px;background:var(--sky);min-width:3px}.pipe b{font-size:13px}
.list-btn{display:flex;align-items:center;gap:10px;width:100%;padding:13px 4px;border-bottom:1px solid #EEF2F7;font-weight:700;text-align:left}.list-btn:last-child{border-bottom:0}.list-btn>span:not(.chip):not(.av){flex:1}.list-btn .chip{flex:0 0 auto}.list-btn em{font-style:normal;color:var(--sub);font-size:13px;font-weight:500}
/* buttons & forms */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:46px;padding:0 18px;border-radius:12px;font-weight:800;background:var(--navy);color:#fff;font-size:15px}
.btn.sky{background:var(--sky2)}.btn.ghost{background:#fff;border:1px solid var(--line);color:var(--navy)}.btn.red{background:var(--redl);color:var(--red)}.btn.block{width:100%}.btn.sm{height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.fab{position:fixed;right:18px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:25;width:56px;height:56px;border-radius:50%;background:var(--sky2);color:#fff;box-shadow:0 6px 18px rgba(30,143,216,.4);display:flex;align-items:center;justify-content:center}
.fab svg{width:26px;height:26px}
label.f{display:block;margin-bottom:12px}label.f>span{display:block;font-size:13px;font-weight:700;color:var(--sub);margin-bottom:5px}
.in{width:100%;height:46px;border:1px solid var(--line);border-radius:11px;padding:0 12px;background:#fff;font-size:15px}
textarea.in{height:auto;min-height:84px;padding:10px 12px;resize:vertical;line-height:1.5}
.in:focus{outline:2px solid var(--sky);border-color:transparent}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.pills{display:flex;flex-wrap:wrap;gap:6px}.pills button{height:36px;padding:0 13px;border-radius:18px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:13.5px;color:var(--sub)}.pills button.on{background:var(--navy);border-color:var(--navy);color:#fff}
/* sheet */
.dim{position:fixed;inset:0;background:rgba(10,20,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:#fff;width:100%;max-width:620px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:8px 18px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
.sheet .grab{width:40px;height:5px;border-radius:3px;background:#D5DEE9;margin:4px auto 12px}
.sheet h3{font-size:19px;font-weight:800;margin-bottom:14px;letter-spacing:-.4px}
.sheet .acts{display:flex;gap:8px;margin-top:6px}.sheet .acts .btn{flex:1}
.cmt{background:var(--ice);border-radius:12px;padding:9px 12px;margin-bottom:8px}.cmt b{font-size:13px}.cmt span{font-size:11.5px;color:var(--sub);margin-left:6px}.cmt p{font-size:14px;margin-top:2px;white-space:pre-wrap}
.empty{text-align:center;color:#94A3B8;font-size:14px;padding:18px 0}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;font-weight:600;z-index:80;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.notice{border-left:4px solid var(--gold);background:var(--goldl);border-radius:12px;padding:11px 13px;margin-bottom:8px}.notice b{display:block;font-weight:800}.notice p{font-size:13.5px;color:#5B4A20;white-space:pre-wrap}.notice span{font-size:11.5px;color:#9A8550}
.rep{white-space:pre-wrap;font-size:14px;background:var(--ice);border-radius:10px;padding:9px 11px;margin-top:4px}
.rep-h{font-size:12.5px;font-weight:800;color:var(--sub);margin-top:10px}
.sales{background:linear-gradient(135deg,#FFF6E2,#FFFDF7);border:1px solid #F3DDA8}
.demo{background:var(--gold);color:var(--navy2);font-size:12px;font-weight:800;text-align:center;padding:5px}
/* login */
.login{min-height:100vh;background:linear-gradient(160deg,var(--navy) 0%,#1B4A9A 70%,var(--sky2) 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px 20px;color:#fff}
.login img{width:210px;margin-bottom:8px}.login h1{font-size:22px;font-weight:800;margin-bottom:4px}.login p{opacity:.8;font-size:14px;margin-bottom:22px}
.login .box{background:#fff;color:var(--ink);border-radius:20px;padding:20px;width:100%;max-width:400px}
.who{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}.who button{border:1.5px solid var(--line);border-radius:12px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:5px;font-weight:700;font-size:14px}.who button small{font-size:11px;color:var(--sub);font-weight:500}.who button.on{border-color:var(--sky2);background:var(--skyl)}
.err{color:var(--red);font-size:13.5px;font-weight:600;margin-top:8px;min-height:20px}
/* PC */
@media(min-width:900px){
  .top{display:none}.tabs{display:none}
  .side{display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;width:236px;background:var(--navy);color:#fff;padding:22px 14px}
  .side img{width:150px;margin:0 8px 6px}.side .st{font-size:12px;opacity:.6;margin:0 10px 22px}
  .side button.nv{display:flex;align-items:center;gap:12px;width:100%;padding:12px 14px;border-radius:12px;font-weight:700;font-size:15px;color:#B8C6E0;margin-bottom:4px}
  .side button.nv svg{width:21px;height:21px}.side button.nv.on{background:rgba(255,255,255,.12);color:#fff}
  .side .me{margin-top:auto;display:flex;align-items:center;gap:10px;padding:12px 8px;border-top:1px solid rgba(255,255,255,.12)}.side .me div{flex:1;font-size:14px;font-weight:700}.side .me small{display:block;font-weight:500;opacity:.6;font-size:12px}
  main{margin-left:236px;max-width:1180px;padding:26px 30px 40px}
  .pc2{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;align-items:start}
  .pc3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
  .kpis{grid-template-columns:repeat(4,1fr)}
  .fab{bottom:28px;right:32px}
  .dim{align-items:center}.sheet{border-radius:20px;max-height:86vh}
  .day{min-height:92px}.day .lbl{display:block}.day .dots{display:none}
  .toast{bottom:30px}
  .ptitle{display:block!important}
}
.ptitle{display:none;font-size:24px;font-weight:800;letter-spacing:-.6px;margin-bottom:16px}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* ============ 설정 ============ */
const API = 'https://script.google.com/macros/s/AKfycbwlKpFGSUq-wCz3_p2PgFcVFETXUeZ4njpVC_VNAMEcMMUK6RxwbbS6dqrOlv13M2GJqA/exec';
const DEMO = !API || new URLSearchParams(location.search).has('demo');
const SALES_APP = 'https://chanoong2.github.io/gunham-sales/';

/* ============ 아이콘 ============ */
const I = {
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  cal:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4.5" width="18" height="16.5" rx="2.5"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg>',
  task:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="2.5"/><path d="m8.5 12 2.5 2.5 4.5-5"/></svg>',
  rep:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></svg>',
  admin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  plus:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
};

/* ============ 유틸 ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const pad = n => String(n).padStart(2,'0');
const ymd = d => d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse = s => { const [y,m,d] = s.split('-').map(Number); return new Date(y, m-1, d); };
const addD = (s, n) => { const d = parse(s); d.setDate(d.getDate()+n); return ymd(d); };
const WD = ['일','월','화','수','목','금','토'];
const md = s => { const d = parse(s); return (d.getMonth()+1)+'월 '+d.getDate()+'일 ('+WD[d.getDay()]+')'; };
const mdShort = s => { const d = parse(s); return (d.getMonth()+1)+'/'+d.getDate()+'('+WD[d.getDay()]+')'; };
const monday = s => { const d = parse(s); const w = (d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d); };
const dday = s => { if(!s) return ''; const n = Math.round((parse(s) - parse(S.today))/864e5); return n===0?'오늘':n>0?'D-'+n:n*-1+'일 지남'; };
function toast(t){ const el = document.createElement('div'); el.className='toast'; el.textContent=t; document.body.appendChild(el); setTimeout(()=>el.remove(), 2600); }

/* ============ 상태 ============ */
const S = { me: localStorage.hq_me||'', token: localStorage.hq_token||'', tab: 'home', d: null, today: ymd(new Date()), calM: null, calSel: null, calScope: 'all', taskScope: 'mine', taskSt: 'open', repWeek: null, ver: '0' };

/* ============ API ============ */
async function api(action, body={}){
  if (DEMO) return demoApi(action, JSON.parse(JSON.stringify(body)));
  const r = await fetch(API, { method:'POST', body: JSON.stringify({ action, name:S.me, token:S.token, ...body }) });
  const j = await r.json();
  if (!j.ok && /로그인이 만료/.test(j.error||'')) { logout(); }
  return j;
}
async function load(){
  const j = await api('all');
  if (!j.ok) { toast(j.error||'불러오지 못했어요'); return; }
  S.d = j; S.today = j.today || S.today; S.ver = j.ver;
  render();
}
function logout(){ localStorage.removeItem('hq_token'); S.token=''; S.d=null; renderLogin(); }

/* ============ 계산 ============ */
const mem = n => (S.d.members||[]).find(m=>m.name===n) || { name:n, color:'#8A9AB2', job:'' };
const av = (n, cls='') => `<span class="av ${cls}" style="background:${esc(mem(n).color||'#8A9AB2')}">${esc(String(n).slice(-2))}</span>`;
const isHol = s => (S.d.holidays||[]).includes(s);
const isWork = s => { const w = parse(s).getDay(); return w!==0 && w!==6 && !isHol(s); };
function monthlyDate(r, y, m){ // m:0-11
  const last = new Date(y, m+1, 0).getDate(); let d = Math.min(Number(r.dom)||1, last);
  let s = y+'-'+pad(m+1)+'-'+pad(d);
  if (r.shift==='Y') { let g=0; while(!isWork(s) && g++<10) s = addD(s,-1); }
  return s;
}
function routineOn(r, s){
  if (r.active==='N') return false;
  if (r.repeat==='daily') return isWork(s);
  if (r.repeat==='weekly') { const w = parse(s).getDay(); return !isHol(s) && String(r.days||'').split(',').map(Number).includes(w); }
  if (r.repeat==='monthly') { const d = parse(s); return monthlyDate(r, d.getFullYear(), d.getMonth())===s; }
  return false;
}
const routinesFor = (s, owner) => (S.d.routines||[]).filter(r => (!owner || r.owner===owner) && routineOn(r, s)).sort((a,b)=>(a.time||'').localeCompare(b.time||''));
const chk = (s, rid) => (S.d.checks||[]).find(c => c.date===s && c.rid===rid);
const isDone = (s, rid) => (chk(s,rid)||{}).done==='Y';
function rate(owner, from, to){
  let due=0, done=0; for (let s=from; s<=to; s=addD(s,1)) routinesFor(s, owner).forEach(r=>{ due++; if(isDone(s,r.id)) done++; });
  return { due, done, p: due? Math.round(done/due*100) : null };
}
const openTasks = () => (S.d.tasks||[]).filter(t => !['완료','보류'].includes(t.status));
const overdue = t => t.due && t.due < S.today && !['완료','보류'].includes(t.status);
const STATUS = ['할 일','진행 중','검토 요청','완료','보류'];
const stChip = s => `<span class="chip ${({'할 일':'','진행 중':'blue','검토 요청':'purple','완료':'green','보류':'gold'})[s]||''}">${esc(s)}</span>`;
const prioChip = p => p==='긴급'?'<span class="chip red">긴급</span>':p==='높음'?'<span class="chip gold">높음</span>':'';
const EVT = { '회의':'#1E8FD8', '교육':'#7B5BD6', '오픈':'#16A36D', '행사':'#E7A321', '휴무':'#E5484D', '기타':'#5C6F8C', '정기':'#0B3B75', '마감':'#F08C00', '미팅':'#16A36D' };
function itemsOn(s, scope){
  const me = S.me, out = [];
  (S.d.events||[]).forEach(e => { const end = e.end||e.date; if (s>=e.date && s<=end && (scope==='all' || e.who==='전체' || !e.who || e.who===me)) out.push({ kind:'event', color: EVT[e.type]||EVT['기타'], title:e.title, sub:[e.time, e.type, e.place, e.who&&e.who!=='전체'?e.who:''].filter(Boolean).join(' · '), obj:e }); });
  (S.d.routines||[]).filter(r=>r.repeat==='monthly' && (scope==='all'||r.owner===me) && routineOn(r,s)).forEach(r => out.push({ kind:'routine', color: EVT['정기'], title:r.title, sub:[r.time, r.owner].join(' · ') + (isDone(s,r.id)?' · 완료':''), obj:r }));
  (S.d.tasks||[]).filter(t=>t.due===s && t.status!=='완료' && (scope==='all'||t.owner===me)).forEach(t => out.push({ kind:'task', color: EVT['마감'], title:'[마감] '+t.title, sub:t.owner+' · '+t.status, obj:t }));
  ((S.d.sales||{}).meetings||[]).filter(m=>m.date===s && (scope==='all'||m.owner===me)).forEach(m => out.push({ kind:'meet', color: EVT['미팅'], title:'[가맹 미팅] '+m.title, sub:m.owner, obj:m }));
  return out;
}

  ${sm? `<div class="card sales"><div class="ch"><h3>가맹 영업</h3><a class="more" href="${esc(S.d.salesAppUrl||SALES_APP)}" target="_blank">영업앱 열기 ›</a></div>
    <div class="stats"><div class="${sm.followT?'bad':''}"><b>${sm.followT}</b><span>오늘 재연락</span></div><div><b>${sm.callT}</b><span>오늘 통화</span></div><div><b>${sm.callW}</b><span>이번 주 통화</span></div><div><b>${sm.propW}</b><span>이번 주 제안</span></div></div>
    ${sm.followT? `<p style="font-size:13px;color:var(--sub);margin-top:8px">재연락: ${esc(((sales.follow||{})[me]||[]).slice(0,4).join(', '))}${sm.followT>4?' 외 '+(sm.followT-4)+'곳':''}</p>`:''}</div>`:''}`;

    ${myTasks.length? myTasks.slice(0,5).map(taskCard).join('') : '<div class="empty">진행 중인 업무가 없어요</div>'}</div>
  <div class="card"><div class="ch"><h3>다가오는 일정</h3><button class="more" data-tab="cal">달력 ›</button></div>
    ${up.length? up.slice(0,6).map(x=>`<div class="ev"><i class="bd" style="background:${x.color}"></i><div class="tx"><b>${esc(x.title)}</b><span>${esc(mdShort(x.s))} · ${esc(x.sub)}</span></div></div>`).join('') : '<div class="empty">7일 안에 일정이 없어요</div>'}</div>

  return `<div class="ptitle">홈</div><div class="pc2"><div>${left}</div><div>${right}</div></div>`;

function todoRow(r, s){
  const c = chk(s, r.id); const d = c && c.done==='Y';
  return `<div class="todo ${d?'done':''}"><button class="chk ${d?'on':''}" data-act="toggle" data-rid="${esc(r.id)}" data-date="${s}" aria-label="완료">${d?I.check:''}</button>
  <div class="tx" data-act="routine" data-rid="${esc(r.id)}" data-date="${s}"><b>${esc(r.title)}</b><span><span class="cat">${esc(r.cat||'업무')}</span>${c&&c.memo?'메모: '+esc(c.memo):esc(r.desc||'')}</span></div>${r.time?`<span class="tm">${esc(r.time)}</span>`:''}</div>`;
}
function teamStrip(){
  const td = S.today; const ms = (S.d.members||[]).filter(m=>m.active!=='N');
  return `<div class="card"><div class="ch"><h3>팀 오늘 현황</h3><button class="more" data-tab="admin">대시보드 ›</button></div><div style="display:flex;gap:12px;overflow-x:auto;padding-bottom:2px">
  ${ms.map(m=>{ const r = rate(m.name, td, td); return `<div style="text-align:center;min-width:58px"><div class="ring light s" style="--p:${r.p||0};margin:0 auto"><b>${r.due? r.p+'%':'-'}</b></div><div style="font-size:12.5px;font-weight:700;margin-top:4px">${esc(m.name)}</div><div style="font-size:11px;color:var(--sub)">${r.done}/${r.due}</div></div>`; }).join('')}</div></div>`;
}
function taskCard(t){
  const od = overdue(t); const cm = (()=>{ try{ return JSON.parse(t.comments||'[]').length; }catch(e){ return 0; } })();
  return `<button class="task" data-act="task" data-id="${esc(t.id)}"><div class="r1"><b>${esc(t.title)}</b>${stChip(t.status)}</div>
  <div class="r2">${av(t.owner,'sm')}<span>${esc(t.owner)}</span>${prioChip(t.prio)}${t.due?`<span class="chip ${od?'red':t.due===S.today?'gold':''}">${esc(mdShort(t.due))} · ${esc(dday(t.due))}</span>`:''}${t.cat?`<span class="cat">${esc(t.cat)}</span>`:''}${cm?`<span>댓글 ${cm}</span>`:''}</div>
  <div class="bar ${t.status==='완료'?'g':''}"><i style="width:${Number(t.progress)||0}%"></i></div></button>`;
}

/* ============ 일정 ============ */

  const [y,m] = S.calM.split('-').map(Number); const first = new Date(y, m-1, 1); const start = addD(ymd(first), -first.getDay());
  let cells = ''; for (let i=0;i<42;i++){ const s = addD(start,i); const d = parse(s); if (i===35 && d.getMonth()!==m-1) break;
    const its = itemsOn(s, S.calScope); const cls = ['day', d.getMonth()!==m-1?'out':'', s===td?'today':'', s===S.calSel?'sel':'', d.getDay()===0?'sun':'', d.getDay()===6?'sat':'', isHol(s)?'hol':''].join(' ');
    cells += `<button class="${cls}" data-act="pick" data-date="${s}"><span class="n">${d.getDate()}</span><span class="dots">${its.slice(0,4).map(x=>`<i style="background:${x.color}"></i>`).join('')}</span>${its.slice(0,3).map(x=>`<span class="lbl" style="background:${x.color}22;color:${x.color}">${esc(x.title)}</span>`).join('')}${its.length>3?`<span class="lbl" style="color:var(--sub)">+${its.length-3}</span>`:''}</button>`; }

  <div><div class="card"><div class="ch"><h3>${esc(md(S.calSel))}${isHol(S.calSel)?' <span class="chip red">공휴일</span>':''}</h3><button class="more" data-act="newEvent" data-date="${S.calSel}">+ 일정</button></div>
  ${sel.length? sel.map(x=>`<div class="ev" ${x.kind==='event'?`data-act="editEvent" data-id="${esc(x.obj.id)}"`:x.kind==='task'?`data-act="task" data-id="${esc(x.obj.id)}"`:''}><i class="bd" style="background:${x.color}"></i><div class="tx"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span>${x.obj.memo?`<span style="display:block">${esc(x.obj.memo)}</span>`:''}</div></div>`).join('') : '<div class="empty">등록된 일정이 없어요</div>'}</div>
  <div class="card"><div class="ch"><h3>이날 정기업무</h3><span class="chip">${rs.length}건</span></div>
  ${rs.length? rs.map(r=>`<div class="ev"><i class="bd" style="background:${mem(r.owner).color}"></i><div class="tx"><b>${esc(r.title)}</b><span>${esc(r.time)} · ${esc(r.owner)}${isDone(S.calSel,r.id)?' · <b style="display:inline;color:var(--green)">완료</b>':''}</span></div></div>`).join('') : '<div class="empty">정기업무가 없어요</div>'}</div></div></div>`;

/* ============ 업무 ============ */
function viewTask(){
  let ts = (S.d.tasks||[]).slice();
  if (S.taskScope==='mine') ts = ts.filter(t=>t.owner===S.me || t.by===S.me);
  const groups = { open: t=>['할 일','진행 중','검토 요청'].includes(t.status), done: t=>t.status==='완료', hold: t=>t.status==='보류' };
  const cnt = k => ts.filter(groups[k]).length;
  ts = ts.filter(groups[S.taskSt]).sort((a,b)=> S.taskSt==='done' ? (b.updated||'').localeCompare(a.updated||'') : (overdue(b)-overdue(a)) || (a.due||'9').localeCompare(b.due||'9'));
  const by = {}; if (S.taskSt==='open') ['검토 요청','진행 중','할 일'].forEach(s=>by[s]=ts.filter(t=>t.status===s));
  return `<div class="ptitle">업무</div>
  <div class="seg"><button class="${S.taskScope==='mine'?'on':''}" data-act="taskScope" data-v="mine">내 업무</button><button class="${S.taskScope==='all'?'on':''}" data-act="taskScope" data-v="all">팀 전체</button></div>
  <div class="pills" style="margin-bottom:12px">${[['open','진행 중'],['done','완료'],['hold','보류']].map(x=>`<button class="${S.taskSt===x[0]?'on':''}" data-act="taskSt" data-v="${x[0]}">${x[1]} ${cnt(x[0])}</button>`).join('')}</div>
  ${S.taskSt==='open'? `<div class="pc3">${Object.keys(by).map(k=>`<div><div class="sec-t" style="margin-top:4px">${k} · ${by[k].length}</div>${by[k].length? by[k].map(taskCard).join('') : '<div class="empty" style="background:#fff;border-radius:14px;border:1px dashed var(--line)">없음</div>'}</div>`).join('')}</div>`
   : (ts.length? `<div class="pc3">${ts.map(taskCard).join('')}</div>` : '<div class="empty">업무가 없어요</div>')}`;
}

    return `<div class="mem"><div class="mh">${av(m.name,'lg')}<div class="nm"><b>${esc(m.name)}</b><span>${esc(m.job||'')} · ${esc(m.role)}</span></div>${rep?'<span class="chip green">보고 제출</span>':'<span class="chip gold">보고 전</span>'}</div>

    ${sm?`<div class="stats" style="margin-top:6px"><div><b>${sm.newW}</b><span>주간 매장 등록</span></div><div><b>${sm.callW}</b><span>주간 통화</span></div><div><b>${sm.propW}</b><span>주간 제안</span></div><div class="${sm.followT?'bad':''}"><b>${sm.followT}</b><span>재연락 밀림</span></div></div>`:''}

async function save(table, obj, msg){ const j = await api('upsert', { table, obj }); if (!j.ok) { toast(j.error||'저장 실패'); return null; } closeSheet(); toast(msg||'저장했어요'); await load(); return j.obj; }
async function remove(table, id){ if (!confirm('삭제할까요?')) return; const j = await api('remove', { table, id }); if (!j.ok) { toast(j.error||'삭제 실패'); return; } closeSheet(); toast('삭제했어요'); await load(); }
async function saveProgress(){ const id = $('#dim').dataset.id; const pg = $('#t_pg').value; const t = S.d.tasks.find(x=>x.id===id); const st = t.status==='할 일' && pg>0 ? '진행 중' : t.status; const j = await api('upsert', { table:'tasks', obj:{ id, progress: pg, status: st } }); if (j.ok) { const i = S.d.tasks.findIndex(x=>x.id===id); S.d.tasks[i] = j.obj; render(); } }

document.addEventListener('click', async e => {
  const tb = e.target.closest('[data-tab]'); if (tb) { S.tab = tb.dataset.tab; closeSheet(); render(); window.scrollTo(0,0); return; }
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, ds = el.dataset, dim = $('#dim')?.dataset || {};
  switch (a) {
    case 'logout': logout(); break;
    case 'toggle': { const c = chk(ds.date, ds.rid); const done = !(c && c.done==='Y'); el.classList.toggle('on', done); el.innerHTML = done?I.check:''; const j = await api('check', { date: ds.date, rid: ds.rid, done, memo: c?.memo||'' }); if (!j.ok) { toast(j.error); } else { S.d.checks = (S.d.checks||[]).filter(x=>x.id!==j.obj.id).concat(j.obj); if (done) toast('완료했어요'); render(); } break; }
    case 'routine': routineSheet(ds.rid, ds.date); break;
    case 'rdone': { const j = await api('check', { date: dim.date, rid: dim.rid, done: ds.v==='1', memo: val('r_memo') }); if (!j.ok) return toast(j.error); S.d.checks = (S.d.checks||[]).filter(x=>x.id!==j.obj.id).concat(j.obj); closeSheet(); render(); toast('저장했어요'); break; }
    case 'task': taskSheet(ds.id); break;
    case 'newTask': S.taskEdit = true; taskSheet(''); break;
    case 'editTask': S.taskEdit = true; taskSheet(dim.id); break;
    case 'saveTask': { if (!val('t_title')) return toast('제목을 입력해 주세요'); await save('tasks', { id: dim.id||'', title: val('t_title'), owner: val('t_owner'), due: val('t_due'), prio: val('t_prio'), cat: val('t_cat'), desc: val('t_desc') }, dim.id?'저장했어요':'업무를 등록했어요'); break; }
    case 'delTask': remove('tasks', dim.id); break;
    case 'setSt': { const id = dim.id; const j = await api('upsert', { table:'tasks', obj:{ id, status: ds.v } }); if (!j.ok) return toast(j.error); const i = S.d.tasks.findIndex(x=>x.id===id); S.d.tasks[i] = j.obj; render(); taskSheet(id); toast('상태: '+ds.v); break; }
    case 'addCm': { const tx = val('t_cm'); if (!tx) return; const j = await api('comment', { id: dim.id, text: tx }); if (!j.ok) return toast(j.error); const i = S.d.tasks.findIndex(x=>x.id===dim.id); S.d.tasks[i] = j.obj; render(); taskSheet(dim.id); break; }
    case 'taskScope': S.taskScope = ds.v; render(); break;
    case 'taskSt': S.taskSt = ds.v; render(); break;
    case 'calScope': S.calScope = ds.v; render(); break;
    case 'calMove': { const [y,m] = S.calM.split('-').map(Number); const d = new Date(y, m-1+Number(ds.v), 1); S.calM = d.getFullYear()+'-'+pad(d.getMonth()+1); render(); break; }
    case 'pick': S.calSel = ds.date; render(); if (innerWidth<900) setTimeout(()=>document.querySelectorAll('.pc2>div')[1]?.scrollIntoView({behavior:'smooth'}),50); break;
    case 'newEvent': eventSheet('', ds.date); break;
    case 'editEvent': eventSheet(ds.id); break;
    case 'saveEvent': { if (!val('e_title')||!val('e_date')) return toast('제목과 날짜를 입력해 주세요'); await save('events', { id: dim.id||'', title: val('e_title'), date: val('e_date'), end: val('e_end'), time: val('e_time'), type: val('e_type'), who: val('e_who'), place: val('e_place'), memo: val('e_memo') }, '일정을 저장했어요'); break; }
    case 'delEvent': remove('events', dim.id); break;
    case 'newNotice': noticeSheet(''); break;
    case 'editNotice': noticeSheet(ds.id); break;
    case 'saveNotice': { if (!val('n_title')) return toast('제목을 입력해 주세요'); await save('notices', { id: dim.id||'', title: val('n_title'), body: val('n_body'), pin: $('#n_pin').checked?'Y':'N' }, '공지를 올렸어요'); break; }
    case 'delNotice': remove('notices', dim.id); break;
    case 'saveRep': { const body = {}; REP_F.forEach(f=>body[f[0]] = val('rep_'+f[0])); if (!Object.values(body).some(Boolean)) return toast('내용을 입력해 주세요'); await save('reports', { id: S.me+'_'+S.repWeek, week: S.repWeek, owner: S.me, body: JSON.stringify(body) }, '주간 보고를 제출했어요'); break; }
    case 'repMove': S.repWeek = addD(S.repWeek, Number(ds.v)); render(); break;
    case 'repGo': S.repWeek = ds.v; render(); window.scrollTo(0,0); break;
    case 'viewRep': repViewSheet(ds.id); break;
    case 'checkRep': await save('reports', { id: dim.id, checked: 'Y', comment: val('rv_cm') }, '확인했어요'); break;
    case 'routines': routinesSheet(); break;
    case 'editRoutine': routineEdit(ds.id||''); break;
    case 'saveRoutine': { if (!val('ro_title')) return toast('업무 이름을 입력해 주세요'); const days = [...document.querySelectorAll('#ro_days button.on')].map(b=>b.dataset.d).join(','); await save('routines', { id: dim.id||'', title: val('ro_title'), owner: val('ro_owner'), time: val('ro_time'), repeat: val('ro_repeat'), cat: val('ro_cat'), days, dom: val('ro_dom'), shift: val('ro_shift'), desc: val('ro_desc'), active: val('ro_active') }, '정기업무를 저장했어요'); break; }
    case 'delRoutine': remove('routines', dim.id); break;
    case 'members': membersSheet(); break;
    case 'editMember': memberEdit(ds.id||''); break;
    case 'saveMember': { const name = dim.id || val('m_name'); if (!name) return toast('이름을 입력해 주세요'); await save('members', { name, role: val('m_role'), job: val('m_job'), color: val('m_color'), active: val('m_active'), order: dim.id ? mem(name).order : (S.d.members.length+1) }, '팀원 정보를 저장했어요'); break; }
    case 'resetPin': { if (!confirm(dim.id+'님의 PIN을 초기화할까요? 다음 로그인 때 새 PIN을 정합니다.')) return; const j = await api('resetPin', { target: dim.id }); toast(j.ok?'PIN을 초기화했어요':j.error); break; }
    case 'settings': settingsSheet(); break;
    case 'saveSettings': { const hol = val('s_hol').split(/\s+/).filter(Boolean); const body = { holidays: hol }; if (val('s_sales')) body.salesSheetUrl = val('s_sales'); const j = await api('settings', body); if (!j.ok) return toast(j.error); closeSheet(); toast('설정을 저장했어요'); load(); break; }
  }
});

    sales: { connected:true, at:t+' 14:02', by:{ '염찬웅':{newW:9,callW:31,propW:6,callT:7,followT:2,total:120,contract:2}, '한얼':{newW:12,callW:24,propW:4,callT:5,followT:5,total:88,contract:1}, '유경웅':{newW:4,callW:11,propW:2,callT:0,followT:3,total:41,contract:0}, '배한나':{newW:1,callW:2,propW:1,callT:0,followT:0,total:5,contract:0} }, pipe:{'신규':96,'부재중':41,'재연락':28,'제안발송':37,'상담중':14,'미팅예정':5,'계약':3,'보류':8,'거절':22}, meetings:[{date:addD(t,1),title:'○○호프 (예시)',owner:'염찬웅'},{date:addD(t,4),title:'△△포차 (예시)',owner:'한얼'}], follow:{'염찬웅':['○○호프','□□치킨'],'한얼':['가나다주점','라마바호프','사아자포차','차카타맥주','파하비어']} } };
  // 지난 며칠 체크 예시
  for (let i=0;i<7;i++){ const s = addD(t,-i); if (s<wk) break; DB.routines.forEach(r=>{ S.d = { ...DB }; if (routineOn(r,s) && (i>0 ? Math.random()<.85 : (r.time||'')<'12:30')) DB.checks.push({ id:s+'_'+r.id, date:s, rid:r.id, owner:r.owner, title:r.title, done:'Y', at:s+' '+r.time, memo:'' }); }); }
  DB.reports.push({ id:'배한나_'+addD(wk,-7), week:addD(wk,-7), owner:'배한나', body:JSON.stringify({done:'인스타 7건, 포스터 교체, AI 릴스 1편',nums:'동명동 술집 9위(지난주 7위)',issue:'겨울 메뉴 사진 원본 필요',next:'지원사업 1건 서류'}), submitted:addD(wk,-3)+' 15:32', checked:'Y', comment:'수고했어요. 사진은 월요일에 전달할게요.' });
}
function demoApi(action, b){
  if (!DB) demoSeed();
  const me = S.me || '박하운'; const admin = (DB.members.find(m=>m.name===me)||{}).role==='관리자';
  const now = () => { const d = new Date(); return ymd(d)+' '+pad(d.getHours())+':'+pad(d.getMinutes()); };
  const key = { members:'name' };
  switch (action) {
    case 'meta': return { ok:true, members: DB.members.filter(m=>m.active!=='N') };
    case 'login': return /^\d{4,8}$/.test(b.pin||'') ? { ok:true, name:b.name, token:'demo', role:(DB.members.find(m=>m.name===b.name)||{}).role } : { ok:false, error:'PIN은 숫자 4~8자리예요' };
    case 'all': return { ok:true, ...JSON.parse(JSON.stringify(DB)), me, admin, today: ymd(new Date()), salesAppUrl: SALES_APP, sheetUrl: admin?'https://docs.google.com/':'', ver:'1' };
    case 'upsert': { const k = key[b.table]||'id'; const arr = DB[b.table]; const o = b.obj; if (!o[k]) o[k] = 'X'+Date.now(); const i = arr.findIndex(x=>x[k]===o[k]); const cur = i>=0?arr[i]:{};
      const m = { ...cur, ...o }; if (b.table==='tasks') { if (i<0) { m.by = me; m.created = now(); m.status = m.status||'할 일'; m.comments='[]'; m.progress = m.progress||'0'; } m.updated = now(); if (m.status==='완료') m.progress='100'; }
      if (b.table==='events' && i<0) m.by = me; if (b.table==='notices' && i<0) { m.by = me; m.at = now(); } if (b.table==='reports' && o.body!==undefined) m.submitted = now();
      if (i>=0) arr[i] = m; else arr.push(m); return { ok:true, obj:m }; }
    case 'remove': { const arr = DB[b.table]; const i = arr.findIndex(x=>x.id===b.id); if (i>=0) arr.splice(i,1); return { ok:true }; }
    case 'check': { const r = DB.routines.find(x=>x.id===b.rid); const o = { id:b.date+'_'+b.rid, date:b.date, rid:b.rid, owner:r.owner, title:r.title, done:b.done?'Y':'N', at:b.done?now():'', memo:b.memo||'' }; DB.checks = DB.checks.filter(x=>x.id!==o.id).concat(o); return { ok:true, obj:o }; }
    case 'comment': { const t = DB.tasks.find(x=>x.id===b.id); const l = JSON.parse(t.comments||'[]'); l.push({ who:me, at:now(), text:b.text }); t.comments = JSON.stringify(l); return { ok:true, obj:{...t} }; }
    case 'settings': if (b.holidays) DB.holidays = b.holidays; return { ok:true };
    case 'resetPin': return { ok:true };
    case 'ver': return { ok:true, ver:'1' };
  }
  return { ok:false, error:'데모에서 지원하지 않아요' };
}
